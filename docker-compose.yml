networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  postgres_data:
  joomla_data:

services:
  database:
    image: postgres:16-alpine
    container_name: database
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - backend_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  joomla:
    image: joomla:latest
    container_name: joomla
    restart: always
    environment:
      JOOMLA_DB_HOST: database
      JOOMLA_DB_TYPE: pgsql
      JOOMLA_DB_USER: ${JOOMLA_DB_USER}
      JOOMLA_DB_PASSWORD: ${JOOMLA_DB_PASSWORD}
      JOOMLA_DB_NAME: ${JOOMLA_DB_NAME}
      JOOMLA_SITE_NAME: ${JOOMLA_SITE_NAME}
      JOOMLA_ADMIN_USER: ${JOOMLA_ADMIN_USER}
      JOOMLA_ADMIN_USERNAME: ${JOOMLA_ADMIN_USERNAME}
      JOOMLA_ADMIN_PASSWORD: ${JOOMLA_ADMIN_PASSWORD}
      JOOMLA_ADMIN_EMAIL: ${JOOMLA_ADMIN_EMAIL}
    networks:
      - frontend_net
      - backend_net
    volumes:
      - joomla_data:/var/www/html
    depends_on:
      database:
        condition: service_healthy

  jupyter:
    image: jupyter/base-notebook:latest
    container_name: jupyter
    restart: always
    command: >
      bash -c "pip install --quiet --no-cache-dir psycopg2-binary && start-notebook.sh --NotebookApp.token='' --NotebookApp.base_url='/jupyter'"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
    networks:
      - frontend_net
    volumes:
      - ./jupyter/notebooks:/home/jovyan/work

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    environment:
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: "http://localhost/grafana/"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    networks:
      - frontend_net
      - backend_net
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    networks:
      - frontend_net
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - joomla
      - jupyter
      - grafana
